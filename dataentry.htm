<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PENSION_DATA</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --neon-cyan:   #00e5ff;
    --neon-blue:   #1a73e8;
    --neon-green:  #39ff14;
    --neon-amber:  #ffc107;
    --neon-red:    #ff3b5c;
    --bg-dark:     #05070f;
    --bg-panel:    #0b1020;
    --bg-panel-2:  #0e1426;
    --text-main:   #d7e3ff;
    --text-dim:    #7f8bb0;
    --border-glow: rgba(0, 229, 255, .55);
  }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    margin: 0;
    padding: 16px;
    color: var(--text-main);
    background:
      radial-gradient(circle at 20% 0%, rgba(0, 229, 255, .12), transparent 45%),
      radial-gradient(circle at 80% 100%, rgba(26, 115, 232, .12), transparent 45%),
      var(--bg-dark);
    min-height: 100vh;
  }

  /* ---- Global neon heading ---- */
  h2 {
    text-align: center;
    margin: 8px 0 16px;
    letter-spacing: 4px;
    font-weight: 700;
    color: #eaf6ff;
    text-shadow:
      0 0 6px var(--neon-cyan),
      0 0 18px rgba(0, 229, 255, .6),
      0 0 42px rgba(0, 229, 255, .35);
    animation: headingPulse 3s ease-in-out infinite;
  }
  @keyframes headingPulse {
    0%, 100% { text-shadow: 0 0 6px var(--neon-cyan), 0 0 18px rgba(0,229,255,.6), 0 0 42px rgba(0,229,255,.35); }
    50%      { text-shadow: 0 0 10px var(--neon-cyan), 0 0 28px rgba(0,229,255,.9), 0 0 60px rgba(0,229,255,.5); }
  }

  /* ---- Glowing card panels ---- */
  .card {
    max-width: 1100px;
    margin: 0 auto 20px;
    background: linear-gradient(160deg, var(--bg-panel), var(--bg-panel-2));
    padding: 20px;
    border-radius: 10px;
    border: 1px solid rgba(0, 229, 255, .25);
    box-shadow:
      0 0 0 1px rgba(0, 229, 255, .08),
      0 0 18px rgba(0, 229, 255, .15),
      inset 0 0 24px rgba(0, 229, 255, .04);
    position: relative;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 11px;
    padding: 1px;
    background: linear-gradient(135deg, rgba(0,229,255,.7), transparent 40%, transparent 60%, rgba(26,115,232,.7));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events: none;
    opacity: .6;
  }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }

  label {
    display: block;
    font-size: 12px;
    margin-bottom: 5px;
    font-weight: 600;
    color: var(--text-dim);
    letter-spacing: .6px;
    text-transform: uppercase;
  }
  label .req {
    color: var(--neon-red);
    margin-left: 2px;
    text-shadow: 0 0 6px rgba(255, 59, 92, .8);
  }

  /* ---- Inputs with neon focus glow ---- */
  input, select {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid rgba(0, 229, 255, .25);
    border-radius: 6px;
    font-size: 14px;
    color: var(--text-main);
    background: rgba(6, 10, 22, .85);
    transition: border-color .2s, box-shadow .2s, background .2s;
  }
  input::placeholder { color: #4a5675; }
  input:focus, select:focus {
    outline: none;
    border-color: var(--neon-cyan);
    background: rgba(10, 18, 36, .95);
    box-shadow:
      0 0 0 1px var(--neon-cyan),
      0 0 12px rgba(0, 229, 255, .55),
      inset 0 0 10px rgba(0, 229, 255, .08);
  }
  /* Date/number spinners in dark theme */
  input[type="date"]::-webkit-calendar-picker-indicator {
    filter: invert(1) drop-shadow(0 0 3px var(--neon-cyan));
    cursor: pointer;
  }
  select option { background: #0b1020; color: var(--text-main); }

  /* Invalid fields glow red */
  input.invalid, select.invalid {
    border-color: var(--neon-red);
    background: rgba(60, 5, 14, .55);
    box-shadow: 0 0 10px rgba(255, 59, 92, .55), inset 0 0 8px rgba(255, 59, 92, .15);
    animation: errorPulse 1.2s ease-in-out infinite;
  }
  @keyframes errorPulse {
    0%, 100% { box-shadow: 0 0 8px rgba(255,59,92,.45), inset 0 0 6px rgba(255,59,92,.12); }
    50%      { box-shadow: 0 0 16px rgba(255,59,92,.85), inset 0 0 12px rgba(255,59,92,.25); }
  }

  /* ---- Buttons with emission ---- */
  .actions {
    margin-top: 20px;
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  button {
    padding: 10px 28px;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: .5px;
    color: #eaf6ff;
    background: linear-gradient(180deg, #1a73e8, #0d47a1);
    border: 1px solid rgba(0, 229, 255, .55);
    border-radius: 6px;
    cursor: pointer;
    transition: transform .15s, box-shadow .25s, background .25s;
    box-shadow:
      0 0 10px rgba(26, 115, 232, .6),
      0 0 24px rgba(26, 115, 232, .3),
      inset 0 0 8px rgba(0, 229, 255, .15);
  }
  button:hover {
    transform: translateY(-1px);
    background: linear-gradient(180deg, #2a86ff, #1565c0);
    box-shadow:
      0 0 16px rgba(0, 229, 255, .8),
      0 0 36px rgba(0, 229, 255, .45),
      inset 0 0 12px rgba(0, 229, 255, .25);
  }
  button:active { transform: translateY(0); }
  button.secondary {
    background: linear-gradient(180deg, #232a3d, #171c2b);
    border-color: rgba(127, 139, 176, .5);
    box-shadow: 0 0 8px rgba(127, 139, 176, .3), inset 0 0 6px rgba(127, 139, 176, .1);
  }
  button.secondary:hover {
    border-color: rgba(0, 229, 255, .6);
    box-shadow: 0 0 14px rgba(0, 229, 255, .5), inset 0 0 10px rgba(0, 229, 255, .2);
  }
  button:disabled {
    background: #1a1f2e;
    color: #556;
    border-color: #333a4d;
    box-shadow: none;
    cursor: not-allowed;
  }

  /* ---- Messages ---- */
  #msg {
    text-align: center;
    margin-top: 12px;
    font-size: 14px;
    color: var(--neon-cyan);
    text-shadow: 0 0 8px rgba(0, 229, 255, .55);
    min-height: 20px;
  }
  #msg.error {
    color: var(--neon-red);
    font-weight: 600;
    text-shadow: 0 0 10px rgba(255, 59, 92, .8);
  }
  #status {
    text-align: center;
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: .4px;
  }

  .hidden { display: none !important; }

  /* ---- Records table ---- */
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
    gap: 8px;
    flex-wrap: wrap;
  }
  .toolbar strong {
    color: #eaf6ff;
    letter-spacing: 1px;
    text-shadow: 0 0 8px rgba(0, 229, 255, .5);
  }
  .toolbar input { max-width: 240px; }

  .table-wrap {
    max-height: 360px;
    overflow: auto;
    border-radius: 8px;
    border: 1px solid rgba(0, 229, 255, .18);
    box-shadow: inset 0 0 20px rgba(0, 229, 255, .05);
  }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td {
    border: 1px solid rgba(0, 229, 255, .12);
    padding: 6px 8px;
    text-align: left;
    white-space: nowrap;
  }
  th {
    background: linear-gradient(180deg, #0f1a30, #0a1224);
    color: var(--neon-cyan);
    position: sticky;
    top: 0;
    letter-spacing: .4px;
    text-shadow: 0 0 8px rgba(0, 229, 255, .55);
    z-index: 1;
  }
  tbody tr { transition: background .15s, box-shadow .15s; }
  tbody tr:hover {
    background: rgba(0, 229, 255, .06);
    box-shadow: inset 0 0 14px rgba(0, 229, 255, .08);
  }
  tbody td { color: #b9c7ee; }

  /* ---- Status badges with glow ---- */
  .badge-pending {
    background: var(--neon-amber);
    color: #1a1200;
    padding: 1px 7px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: 700;
    margin-left: 6px;
    box-shadow: 0 0 8px rgba(255, 193, 7, .8);
  }
  .badge-synced {
    background: var(--neon-green);
    color: #042000;
    padding: 1px 7px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: 700;
    margin-left: 6px;
    box-shadow: 0 0 10px rgba(57, 255, 20, .8);
  }
  .badge-error {
    background: var(--neon-red);
    color: #fff;
    padding: 1px 7px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: 700;
    margin-left: 6px;
    box-shadow: 0 0 10px rgba(255, 59, 92, .9);
  }

  /* ---- Scrollbars ---- */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: #070b16; }
  ::-webkit-scrollbar-thumb {
    background: linear-gradient(180deg, #123a5c, #0a1f33);
    border-radius: 6px;
    border: 1px solid rgba(0, 229, 255, .25);
  }
  ::-webkit-scrollbar-thumb:hover {
    background: linear-gradient(180deg, #1a5b8c, #0e2c48);
    box-shadow: 0 0 8px rgba(0, 229, 255, .6);
  }
</style>
</head>
<body>
<h2>PENSION_DATA</h2>

<div class="card">
  <form id="pensionForm" novalidate>
    <div class="grid" id="formGrid"></div>
    <div class="actions">
      <button type="submit" id="submitBtn">Save Locally &amp; Sync</button>
      <button type="button" id="syncBtn" class="secondary">Sync Now</button>
      <button type="button" id="clearBtn" class="secondary">Clear Synced</button>
    </div>
    <div id="msg"></div>
    <div id="status"></div>
  </form>
</div>

<div class="card">
  <div class="toolbar">
    <strong>Entered Records</strong>
    <input type="text" id="searchBox" placeholder="Search...">
    <button type="button" id="refreshBtn" class="secondary">Refresh</button>
  </div>
  <div class="table-wrap">
    <table id="recordsTable">
      <thead><tr id="recordsHead"></tr></thead>
      <tbody id="recordsBody"></tbody>
    </table>
  </div>
</div>

<script>
/* ====== CONFIG: paste your deployed Apps Script Web App URL here ====== */
const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzdYuHMIHJNhTt0TzTZ5NO9OVAeSVGn8r6TvQf9yhXxN3PPOzSCjjpb4FkFA8C9VGWzvA/exec';
/* ===================================================================== */

const FORM_FIELDS = [
  'Aadhaar Number',
  'Registration No.',
  'Beneficiary First Name',
  'Beneficiary Last Name',
  'Gender',
  'Date of Birth',
  'Father First Name',
  'Father Last Name',
  'Mother First Name',
  'Mother Last Name',
  'Caste',
  'Caste Certificate No.',
  'EPIC / Voter ID',
  'GP / Ward No',
  'Village / Town / City',
  'Post Office',
  'Pin Code',
  'Mobile No',
  'Bank IFSC',
  'Bank Account No'
];

const HEADERS = [
  'Aadhaar Number', 'Application Date', 'Application Type',
  'Registration No.', 'Registration Date', 'Beneficiary First Name',
  'Beneficiary Middle Name', 'Beneficiary Last Name', 'Gender',
  'Date of Birth', 'Father First Name', 'Father Middle Name',
  'Father Last Name', 'Mother First Name', 'Mother Middle Name',
  'Mother Last Name', 'Caste', 'Caste Certificate No.',
  'Marital Status', 'Monthly Family Income (In Rs)', 'EPIC / Voter ID',
  'GP / Ward No', 'Village / Town / City', 'Post Office', 'Pin Code',
  'Mobile No', 'Bank IFSC', 'Bank Account No'
];

const DROPDOWN_MAP = {
  'GP / Ward No': 'gp',
  'Post Office': 'postOffice',
  'Bank IFSC': 'ifsc'
};

const STATIC_OPTIONS = {
  'Caste': ['General', 'SC', 'ST'],
  'Gender': ['Male', 'Female'],
  'Pin Code': ['732123', '732126']
};

const DATE_FIELDS = ['Date of Birth'];
const NUMBER_FIELDS = ['Pin Code', 'Mobile No'];

/* ---- Default initial values for specific fields ---- */
const DEFAULT_VALUES = {
  'Registration No.': 'J02000'
};

/* Local storage keys */
const LS_QUEUE = 'pension_queue_v1';     /* pending (unsynced) rows */
const LS_DONE  = 'pension_done_v1';      /* synced rows kept locally for display */

function uid() {
  return 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
}

function loadLS(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch { return fallback; }
}

function saveLS(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {
    console.warn('localStorage save failed', e);
  }
}

function getQueue() { return loadLS(LS_QUEUE, []); }
function setQueue(q) { saveLS(LS_QUEUE, q); updateStatus(); }
function getDone()  { return loadLS(LS_DONE, []);  }
function setDone(d) { saveLS(LS_DONE, d); }

function fieldType(h) {
  if (DATE_FIELDS.includes(h)) return 'date';
  if (NUMBER_FIELDS.includes(h)) return 'number';
  return 'text';
}

function formatCellValue(header, value) {
  if (value === null || value === undefined || value === '') return '';
  if (DATE_FIELDS.includes(header)) {
    const d = new Date(value);
    if (isNaN(d.getTime())) return String(value);
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const yyyy = d.getFullYear();
    return dd + '/' + mm + '/' + yyyy;
  }
  return String(value);
}

function buildForm(dropdownData) {
  const grid = document.getElementById('formGrid');
  grid.innerHTML = '';
  FORM_FIELDS.forEach(h => {
    const wrap = document.createElement('div');
    wrap.dataset.field = h;
    const label = document.createElement('label');
    label.setAttribute('for', h);
    label.textContent = h;
    const req = document.createElement('span');
    req.className = 'req';
    req.textContent = '*';
    label.appendChild(req);

    let input;
    if (STATIC_OPTIONS[h] || DROPDOWN_MAP[h]) {
      input = document.createElement('select');
      input.id = h; input.name = h;
      const empty = document.createElement('option');
      empty.value = ''; empty.textContent = '-- Select --';
      input.appendChild(empty);
      const opts = STATIC_OPTIONS[h] ? STATIC_OPTIONS[h] : (dropdownData[DROPDOWN_MAP[h]] || []);
      opts.forEach(v => {
        const opt = document.createElement('option');
        opt.value = v; opt.textContent = v;
        input.appendChild(opt);
      });
    } else {
      input = document.createElement('input');
      input.type = fieldType(h);
      input.id = h; input.name = h;
      if (input.type === 'number') input.step = 'any';
    }

    /* Apply default initial value (e.g., Registration No. = J02000) */
    if (DEFAULT_VALUES[h] !== undefined) {
      input.value = DEFAULT_VALUES[h];
    }

    /* Clear invalid state as soon as the user fixes the field */
    input.addEventListener('input', () => { input.classList.remove('invalid'); });
    input.addEventListener('change', () => { input.classList.remove('invalid'); });

    wrap.appendChild(label);
    wrap.appendChild(input);
    grid.appendChild(wrap);
  });

  const casteEl = document.getElementById('Caste');
  casteEl.addEventListener('change', toggleCasteCert);
  toggleCasteCert();
}

function toggleCasteCert() {
  const caste = document.getElementById('Caste').value;
  const wrap = document.querySelector('[data-field="Caste Certificate No."]');
  const input = document.getElementById('Caste Certificate No.');
  const show = (caste === 'SC' || caste === 'ST');
  wrap.classList.toggle('hidden', !show);
  if (!show) {
    input.value = '';
    input.classList.remove('invalid');
  }
}

function loadDropdowns() {
  fetch(WEB_APP_URL + '?action=dropdowns')
    .then(r => r.json())
    .then(data => buildForm(data))
    .catch(err => {
      console.warn('Dropdown load failed', err);
      buildForm({});
    });
}

/* ---------- Validation (mandatory fields) ---------- */

function isFieldVisible(header) {
  if (header === 'Caste Certificate No.') {
    const casteEl = document.getElementById('Caste');
    const caste = casteEl ? casteEl.value : '';
    return caste === 'SC' || caste === 'ST';
  }
  return true;
}

function validateForm() {
  const invalidFields = [];

  FORM_FIELDS.forEach(h => {
    const el = document.getElementById(h);
    if (!el) return;

    /* Skip hidden conditional fields */
    if (!isFieldVisible(h)) {
      el.classList.remove('invalid');
      return;
    }

    const val = (el.value || '').trim();
    if (!val) {
      el.classList.add('invalid');
      invalidFields.push(h);
      return;
    }

    /* Field-specific format checks */
    if (h === 'Aadhaar Number' && !/^\d{12}$/.test(val)) {
      el.classList.add('invalid');
      invalidFields.push(h + ' (12 digits)');
      return;
    }

    if (h === 'Pin Code' && !/^\d{6}$/.test(val)) {
      el.classList.add('invalid');
      invalidFields.push(h + ' (6 digits)');
      return;
    }

    if (h === 'Mobile No' && !/^\d{10}$/.test(val)) {
      el.classList.add('invalid');
      invalidFields.push(h + ' (10 digits)');
      return;
    }

    el.classList.remove('invalid');
  });

  return invalidFields;
}

/* ---------- Local save + background sync ---------- */

function collectForm() {
  const formObject = {};
  HEADERS.forEach(h => {
    const el = document.getElementById(h);
    formObject[h] = el ? el.value : '';
  });
  const dob = formObject['Date of Birth'];
  if (dob && dob.indexOf('-') > -1) {
    const p = dob.split('-');
    if (p.length === 3) formObject['Date of Birth'] = p[2] + '/' + p[1] + '/' + p[0];
  }
  return formObject;
}

/* Helper: restore default values after form reset */
function applyDefaults() {
  Object.keys(DEFAULT_VALUES).forEach(h => {
    const el = document.getElementById(h);
    if (el) el.value = DEFAULT_VALUES[h];
  });
}

document.getElementById('pensionForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const msgEl = document.getElementById('msg');
  msgEl.classList.remove('error');

  /* ---- Mandatory field validation: block save until all filled ---- */
  const invalid = validateForm();
  if (invalid.length) {
    msgEl.classList.add('error');
    msgEl.textContent = 'Please fill all required fields correctly: ' + invalid.join(', ');
    const firstInvalid = document.querySelector('.invalid');
    if (firstInvalid) firstInvalid.focus();
    return;
  }

  const data = collectForm();
  const row = { id: uid(), status: 'pending', attempts: 0, ts: Date.now(), data };
  const q = getQueue();
  q.push(row);
  setQueue(q);

  msgEl.textContent = 'Saved locally. Syncing in background...';
  document.getElementById('pensionForm').reset();
  applyDefaults();          /* <-- re-apply J02000 after reset */
  toggleCasteCert();
  renderMergedRecords();
  kickSync();
});

let syncing = false;

function kickSync() {
  if (syncing) return;
  const q = getQueue().filter(r => r.status !== 'syncing');
  if (!q.length) return;
  syncing = true;
  processQueue();
}

function processQueue() {
  const queue = getQueue();
  const idx = queue.findIndex(r => r.status === 'pending' || r.status === 'error');
  if (idx === -1) {
    syncing = false;
    updateStatus();
    return;
  }
  const item = queue[idx];
  queue[idx].status = 'syncing';
  setQueue(queue);

  fetch(WEB_APP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(item.data)
  })
  .then(r => r.json())
  .then(res => {
    const q2 = getQueue();
    const i2 = q2.findIndex(r => r.id === item.id);
    if (i2 === -1) { syncing = false; processQueue(); return; }
    if (res.ok) {
      q2.splice(i2, 1);
      setQueue(q2);
      const done = getDone();
      done.push({ ...item, status: 'synced' });
      setDone(done);
      document.getElementById('msg').textContent = 'Synced. ' + (q2.length) + ' pending.';
    } else {
      q2[i2].status = 'error';
      q2[i2].attempts = (q2[i2].attempts || 0) + 1;
      q2[i2].lastError = res.msg;
      setQueue(q2);
      document.getElementById('msg').textContent = 'Sync error: ' + res.msg + ' (will retry)';
    }
    renderMergedRecords();
    if (q2.length) setTimeout(processQueue, 500);
    else { syncing = false; updateStatus(); }
  })
  .catch(err => {
    const q2 = getQueue();
    const i2 = q2.findIndex(r => r.id === item.id);
    if (i2 !== -1) {
      q2[i2].status = 'error';
      q2[i2].attempts = (q2[i2].attempts || 0) + 1;
      q2[i2].lastError = err.message;
      setQueue(q2);
    }
    document.getElementById('msg').textContent = 'Network error, will retry.';
    renderMergedRecords();
    setTimeout(() => { syncing = false; processQueue(); }, 3000);
  });
}

function updateStatus() {
  const q = getQueue();
  const pending = q.filter(r => r.status === 'pending').length;
  const errs = q.filter(r => r.status === 'error').length;
  document.getElementById('status').textContent =
    'Local pending: ' + pending + (errs ? ' | errors: ' + errs : '');
}

document.getElementById('syncBtn').addEventListener('click', () => {
  const q = getQueue().map(r => r.status === 'error' ? { ...r, status: 'pending' } : r);
  setQueue(q);
  kickSync();
});

document.getElementById('clearBtn').addEventListener('click', () => {
  setDone([]);
  renderMergedRecords();
});

/* ---------- Records list (local pending + local done + server rows) ---------- */

const LIST_COLUMNS = FORM_FIELDS;
let SERVER_ROWS = [];
let SERVER_INDEX = {};

function loadRecords() {
  fetch(WEB_APP_URL + '?action=list')
    .then(r => r.json())
    .then(data => {
      SERVER_ROWS = data.rows || [];
      SERVER_INDEX = {};
      (data.headers || HEADERS).forEach((h, i) => { SERVER_INDEX[h] = i; });
      renderMergedRecords();
    })
    .catch(err => {
      console.warn('List load failed', err);
      renderMergedRecords();
    });
}

function dataToRowArray(d) {
  return HEADERS.map(h => d[h] || '');
}

function dedupeKey(rowArray) {
  /* Aadhaar + Registration No. as identity; fallback to full row */
  const a = String(rowArray[SERVER_INDEX['Aadhaar Number']] || '');
  const r = String(rowArray[SERVER_INDEX['Registration No.']] || '');
  if (a || r) return a + '|' + r;
  return rowArray.join('|');
}

function renderMergedRecords() {
  const head = document.getElementById('recordsHead');
  const body = document.getElementById('recordsBody');

  head.innerHTML = '';
  LIST_COLUMNS.forEach(h => {
    const th = document.createElement('th');
    th.textContent = h;
    head.appendChild(th);
  });

  const rows = [];

  /* Server rows first */
  SERVER_ROWS.forEach(r => rows.push({ source: 'server', arr: r, status: '' }));

  /* Local done rows (synced from this browser) - skip if already in server by dedupe */
  const serverKeys = new Set(SERVER_ROWS.map(r => dedupeKey(r)));
  getDone().forEach(item => {
    const arr = dataToRowArray(item.data);
    const key = dedupeKey(arr);
    if (!serverKeys.has(key)) {
      rows.push({ source: 'done', arr, status: 'synced' });
    }
  });

  /* Local pending/error rows */
  getQueue().forEach(item => {
    const arr = dataToRowArray(item.data);
    rows.push({ source: 'queue', arr, status: item.status || 'pending' });
  });

  body.innerHTML = '';
  if (!rows.length) {
    body.innerHTML = '<tr><td colspan="' + LIST_COLUMNS.length + '">No records yet</td></tr>';
    return;
  }

  rows.forEach(entry => {
    const tr = document.createElement('tr');
    LIST_COLUMNS.forEach(h => {
      const td = document.createElement('td');
      const idx = SERVER_INDEX[h];
      let v = '';
      if (idx !== undefined) v = formatCellValue(h, entry.arr[idx]);
      else {
        /* Fallback: look by header order in HEADERS if server index missing */
        const hi = HEADERS.indexOf(h);
        if (hi !== -1) v = formatCellValue(h, entry.arr[hi]);
      }
      td.textContent = v;
      tr.appendChild(td);
    });

    /* Status badge appended to first cell */
    if (entry.source !== 'server') {
      const firstCell = tr.firstChild;
      const badge = document.createElement('span');
      badge.className = entry.status === 'synced' ? 'badge-synced'
                    : entry.status === 'error'  ? 'badge-error'
                    : 'badge-pending';
      badge.textContent = entry.status;
      firstCell.appendChild(badge);
    }
    body.appendChild(tr);
  });

  updateStatus();
}

document.getElementById('searchBox').addEventListener('input', function() {
  const q = this.value.trim().toLowerCase();
  if (!q) { renderMergedRecords(); return; }
  const all = document.querySelectorAll('#recordsBody tr');
  all.forEach(tr => {
    const txt = tr.textContent.toLowerCase();
    tr.style.display = txt.includes(q) ? '' : 'none';
  });
});

document.getElementById('refreshBtn').addEventListener('click', loadRecords);

/* ---------- Init ---------- */

/* Auto-retry pending on page load */
window.addEventListener('load', () => {
  buildForm({});
  loadDropdowns();
  loadRecords();
  kickSync();
  setInterval(() => {
    if (getQueue().some(r => r.status === 'pending' || r.status === 'error')) kickSync();
  }, 15000);
});
</script>
